# Copia de referencia del ~/web/docker-compose.yml de la Raspberry Pi.
# El token del túnel va en ~/web/.env (TUNNEL_TOKEN=...), nunca en el repo.
services:
  web:
    image: caddy:2
    restart: unless-stopped
    volumes:
      - ./site:/usr/share/caddy:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

  stats:
    image: node:24-alpine
    restart: unless-stopped
    # Mismo usuario que el dueño de ~/web/stats-data en la Pi (comprobar con: id -u)
    user: "1000:1000"
    working_dir: /app
    command: ["node", "--disable-warning=ExperimentalWarning", "server.mjs"]
    environment:
      - DB_PATH=/data/stats.db
      # Página de estado de Uptime Kuma para luisse.pro/homelab (van en ~/web/.env)
      - KUMA_URL=${KUMA_URL:-}
      - KUMA_SLUG=${KUMA_SLUG:-}
      # Panel privado de estadísticas, detrás de Cloudflare Access (ver docs/estadisticas.md)
      - ACCESS_TEAM=${ACCESS_TEAM:-}
      - ACCESS_AUD=${ACCESS_AUD:-}
      # Resumen semanal por correo, los lunes a las 9 (ver docs/estadisticas.md)
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - REPORT_TO=${REPORT_TO:-}
    volumes:
      - ./stats/server.mjs:/app/server.mjs:ro
      - ./stats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 1m
      timeout: 5s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    # También en la red "tunel", para llegar a Repaso (~/repaso)
    networks: [default, tunel]

networks:
  tunel:
    external: true
